services:
  - type: web
    name: treino-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: treino-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false   # set manually in Render dashboard

databases:
  - name: treino-db
    plan: free
    databaseName: treino
